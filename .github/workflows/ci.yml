name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff lint
        run: uv run ruff check src tests demo package.py

      - name: Run pytest suite
        run: uv run pytest -v

      - name: Run portfolio demo and export HTML report
        run: uv run python demo/run_portfolio_demo.py --report demo_report.html

      - name: Upload demo HTML report artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: comfyguard-demo-report
          path: demo_report.html
